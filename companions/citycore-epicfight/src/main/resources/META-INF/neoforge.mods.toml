modLoader = "javafml"
loaderVersion = "[4,)"
license = "All rights reserved"

[[mods]]
modId = "citycore_epicfight"
version = "${version}"
displayName = "CityCore — Epic Fight"
description = '''
Donne aux PNJ du plugin CityCore (artisans, habitants, gardes, armées ennemies) les animations
d'Epic Fight : marche, course, coups et tirs. Mod côté serveur : rien à installer chez les joueurs.
'''
# Mod du serveur seulement : un client qui ne l'a pas peut se connecter
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.citycore_epicfight]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.citycore_epicfight]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Epic Fight facultatif : sans lui, le mod ne fait rien (et le serveur démarre quand même)
[[dependencies.citycore_epicfight]]
modId = "epicfight"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
