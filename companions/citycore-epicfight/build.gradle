plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.citycore'
base { archivesName = 'citycore-epicfight' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    mods {
        citycore_epicfight {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Compilation seulement : à l'exécution, les classes viennent du mod Epic Fight installé
    // (rien n'est recopié dans notre jar)
    def epicFight = file(project.property('epicfight_jar'))
    if (!epicFight.exists()) {
        throw new GradleException("Jar d'Epic Fight introuvable : ${epicFight} (réglage epicfight_jar de gradle.properties)")
    }
    compileOnly files(epicFight)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Version du mod reprise dans neoforge.mods.toml
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}
