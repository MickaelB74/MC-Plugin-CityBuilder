# ============================================================
#  Bot Discord de CityCore — configuration
#  Fichier lu au démarrage du bot (dans le dossier d'où il est lancé).
#  ⚠ Il contient des jetons : ne le partagez pas, ne le mettez pas dans un dépôt.
# ============================================================

# Jeton du bot : https://discord.com/developers/applications → votre application → Bot → Reset Token
discord.jeton=
# Identifiant du serveur Discord : mode développeur activé, clic droit sur le serveur → Copier l'identifiant
discord.serveur=

# API du mod compagnon (config/citycore_companion.toml du serveur Minecraft, section discord) :
# adresse = http://<adresse>:<port>, jeton = valeur de discord.jeton (créée au premier démarrage du serveur)
api.adresse=http://127.0.0.1:8787
api.jeton=

# Salons : créés par le bot dans cette catégorie s'ils n'existent pas (noms modifiables ensuite
# dans Discord : le bot retient leurs identifiants dans etat-bot.json).
# Pour utiliser un salon existant, indiquez son identifiant dans la ligne « .id » correspondante.
salons.categorie=Valmont
salons.evenements=évènements
salons.evenements.id=
salons.ville=valmont
salons.ville.id=
salons.admin=admin
salons.admin.id=
salons.chat=chat
salons.chat.id=
salons.joueurs=joueurs
salons.joueurs.id=
# Salon vocal fermé qui affiche le statut : « 🟢 Nom · 3/20 joueurs » ou « 🔴 Nom · hors ligne »
salons.statut.id=

# Nom du serveur dans le statut ; vide = celui donné par le serveur (discord.nomServeur du mod, ou son
# MOTD s'il a été réglé), sinon le nom de la ville. « A Minecraft Server » n'est jamais affiché.
statut.nom=
# Discord n'autorise que deux changements de nom d'un salon par tranche de dix minutes : le bot
# renomme le salon vocal dès qu'un joueur arrive ou part tant qu'il lui reste un changement, puis
# attend. Le statut du bot (sous son nom) suit, lui, en temps réel.

# Intervalle de mise à jour des cartes de la ville et des joueurs (secondes)
cartes.intervalle-secondes=15
# Couleur de la carte de la ville (RRGGBB)
cartes.couleur=F1CF5E
# Image de la tête des joueurs sur leur carte : adresse avec {nom} ou {uuid}. Vide = service
# mc-heads.net (https://mc-heads.net/head/{nom}/128), qui reçoit alors le pseudo des joueurs et
# rend la tête du compte Minecraft de ce nom. « aucune » = pas d'image.
cartes.tete=
