# ============================================================
#  CityCore — configuration
#  ⚠ Économie générée et vérifiée (aucun arbitrage achat → craft → revente
#    avec les recettes vanilla 1.21.1). Après modification, lancez /city eco check.
# ============================================================

# Version du format : un config.yml plus ancien est sauvegardé puis remplacé au démarrage.
# Ne modifiez pas cette valeur.
config-version: 22

# ============================================================
#  AGRANDISSEMENT DE LA VILLE (emplacements de chunks)
# ============================================================
city-expand:
  # Prix du premier emplacement acheté (hors emplacements offerts)
  base-price: 150
  # Chaque emplacement acheté coûte 8 % de plus que le précédent
  multiplier: 1.08
  # Plafond du prix d'un emplacement
  max-price: 2500
  # Emplacements offerts par Alderic à la fondation (une seule fois)
  free-chunks: 6
  # Coins versés dans la caisse à la fondation
  first-meeting-coins: 100

# ============================================================
#  PALIERS DE LA VILLE — surcharges facultatives
#  Valeurs par défaut dans CityTier.java (charte = coût pour passer au palier suivant)
#  Dix chapitres : 1→2 : 150 | 2→3 : 400 | 3→4 : 800 | 4→5 : 1500 | 5→6 : 2500
#  6→7 : 4000 | 7→8 : 6000 | 8→9 : 8500 | 9→10 : 12000 (le dragon est vaincu au chapitre IX)
# ============================================================
city-tiers: {}
#  Exemple :
#  city-tiers:
#    4:
#      upgrade-cost: 3000
#      reward-chunks: 12

# Objectifs des quêtes de ville (par id de quête, voir CityTier.java)
city-quests:
  targets: {}
#  Exemple : targets: {t4_walls: 512, t3_rounds: 40}

# ============================================================
#  PROGRESSION (/city progression)
# ============================================================
progression:
  # Onglet « La Renaissance de Valmont » dans l'écran des progrès (touche L) :
  # chapitres, habitants recrutés et hauts faits, avec notifications « Progrès réalisé »
  advancements: true

# ============================================================
#  INTERFACES DES HABITANTS (pack de ressources « Valmont »)
#  Menus illustrés des PNJ. Le pack ne contient que des images de menus :
#  aucun bloc ni objet n'est modifié. Un joueur qui refuse le pack garde
#  les menus classiques (/city ui pour changer de style).
# ============================================================
ui-pack:
  enabled: true
  # Le plugin héberge lui-même le pack (mini serveur web intégré)
  self-host: true
  port: 8164
  # Adresse que les joueurs utilisent pour joindre ce serveur (IP publique ou nom de domaine).
  # Vide : adresse locale détectée (suffit sur le même PC ou en réseau local).
  public-address: ""
  # Ou adresse web où vous avez déposé plugins/CityCore/ui-pack/CityCore-UI.zip
  # (prioritaire sur l'hébergement intégré ; le fichier doit être identique)
  url: ""
  # true : pack obligatoire (un refus déconnecte le joueur)
  required: false

# ============================================================
#  MODS DU SERVEUR (serveur hybride mods + plugins, ex. Youer)
#  Certains habitants dépendent d'un mod. Sans lui, ils se recrutent et
#  s'installent, mais ne commercent pas et ne confient pas de quêtes.
#  auto = détection | on = forcer « présent » | off = forcer « absent » (test)
# ============================================================
mod-integrations:
  # Dragon Mounts Remastered (identifiant dmr) : Harold, le dresseur de dragons
  dmr: auto
  # Tax' Ocean Villager (identifiant taxov) : Jack Sparrow et les navires du large
  taxov: auto

# ============================================================
#  ÉCONOMIE DES PNJ
#  - Ce qu'un joueur vend entre dans le stock du PNJ (capacité limitée).
#  - Plus l'entrepôt est plein, moins il paie ; plein, il n'achète plus.
#  - Le stock se revend au prix de rachat × resale-multiplier (toujours plus cher).
#  - Les articles fabriqués consomment des ingrédients dans les stocks.
#  - Les items achetés aux PNJ sont marqués : ni revendables, ni valables
#    pour les quêtes des PNJ (mais utilisables pour bâtir et livrer les chantiers).
# ============================================================
npc-economy:
  resale-multiplier: 2.0
  # Prix plein tant que le stock est sous ce % de la capacité
  full-price-until: 40
  # % du prix plein payé quand l'entrepôt est presque plein
  min-price-percent: 35
  # % de la capacité consommé par heure (si au moins un joueur est connecté). 0 = off
  consumption-percent-per-hour: 8
  consumption-floor-percent: 25   # la consommation ne descend pas sous ce % de la capacité (emplois, repas) ; 0 = jusqu'à vide
  # Avantages de l'employé d'un PNJ (remplace l'ancien multiplicateur de stock, source de duplication)
  job-sell-bonus: 10
  job-shop-discount: 15
  # Marge minimale exigée par le contrôle anti-arbitrage (/city eco check)
  validator-margin: 10

npc-quests:
  # Délai (minutes) entre deux quêtes d'un même PNJ, par joueur
  main-cooldown-minutes: 20
  special-cooldown-minutes: 60
  # Récompense = valeur de marché des items/créatures demandés × prime
  main-reward-premium: 1.25
  special-reward-premium: 1.5

# ============================================================
#  SKINS DES PNJ (Alderic, Brennan, Jack Sparrow et Gandalf ont le leur dans le plugin)
#  1. Sur https://mineskin.org, importez l'image du skin (ou le pseudo d'un joueur).
#  2. Copiez « Texture Value » dans value et « Texture Signature » dans signature.
#  3. Redémarrez : le skin s'applique au PNJ (même déjà présent) et à son portrait.
# ============================================================
npc-skins:
  bastien: {value: "", signature: ""}
  helene: {value: "", signature: ""}
  martin: {value: "", signature: ""}
  godefroy: {value: "", signature: ""}
  rosalie: {value: "", signature: ""}
  thorvald: {value: "", signature: ""}
  agathe: {value: "", signature: ""}
  edmond: {value: "", signature: ""}
  roland: {value: "", signature: ""}
  anselme: {value: "", signature: ""}
  isabeau: {value: "", signature: ""}
  leon: {value: "", signature: ""}
  beatrice: {value: "", signature: ""}
  robin: {value: "", signature: ""}
  indiana: {value: "", signature: ""}
  docbrown: {value: "", signature: ""}
  geralt: {value: "", signature: ""}
  harold: {value: "", signature: ""}

