# ============================================================
#  SOMMET — Summit Listener
# ============================================================
summit:
  # Activer/désactiver le système
  enabled: true

  # Altitude Y minimale pour considérer un sommet
  min-height: 300

  # Rayon circulaire (blocs) dans lequel aucun bloc ne doit
  # exister à la même hauteur ou plus haut que le joueur
  scan-radius: 100

  # Clé du son dans le resource pack (assets/citycore/sounds.json)
  sound-key: "citycore:summit_theme"

  # Volume du son (0.0 à 1.0)
  sound-volume: 1.0

  # Pitch du son (0.5 = grave, 1.0 = normal, 2.0 = aigu)
  sound-pitch: 1.0

  # Délai minimum entre deux déclenchements pour le même joueur (secondes)
  cooldown-seconds: 60

  # Message envoyé au joueur (vide = aucun message)
  message: "§b⛰ §eVous avez atteint un sommet !"

# ============================================================
#  DRAGON — Dragon Listener
# ============================================================
dragon:
  enabled: true
  min-height: 500          # altitude de déclenchement (blocs)
  sound-key: "citycore:dragon"
  sound-volume: 1.0
  sound-pitch: 1.0
  cooldown-seconds: 120
  message: "§5🐉 §dVous planez au-dessus des nuages !"

# ============================================================
#  PIRATE — Pirate listener
# ============================================================
pirate:
  enabled: true
  sound-key: "citycore:pirate"
  sound-volume: 1.0
  sound-pitch: 1.0
  cooldown-seconds: 180
  message: "§6☀ §eL'horizon rougit sous vos yeux, capitaine !"
  time-start: 11500   # début du coucher (~11500 = 17h30 in-game)
  time-end: 13000     # fin du coucher  (~13000 = 19h00 in-game)
  yaw-tolerance: 30.0 # tolérance angulaire en degrés autour de l'ouest