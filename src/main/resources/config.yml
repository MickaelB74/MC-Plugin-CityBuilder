# ============================================================
#  SCRIBE & CARTOGRAPHE — Isabeau (chapitre VII)
#  Le savoir : papier, livres, cartes.
#  Bibliothèques, pupitres, boussoles, cartes... et les Chroniques de Valmont (lore).
# ============================================================
isabeau:
  xp-per-stack: 1
  xp-per-coin: 1
  level-thresholds: {2: 500, 3: 2000, 4: 5500, 5: 12000}
  # Rachat (joueur → PNJ) : prix d'un lot à pleine demande, taille du lot, capacité de l'entrepôt
  sell-prices:
    PAPER: {price: 10, quantity: 32, capacity: 1024}
    BOOK: {price: 8, quantity: 4, capacity: 256}
    MAP: {price: 8, quantity: 1, capacity: 64}
  # Boutique : 'requires' = ingrédients pris dans un stock (cle_pnj:MATERIAU pour un autre artisan),
  #            'supply' = approvisionnement propre (max, +1 toutes les restock-minutes)
  shop:
    1:
      - material: WRITTEN_BOOK
        price: 5
        quantity: 1
        supply: {max: 10, restock-minutes: 10}
        name: "§3Chroniques de Valmont §7(tome I)"
        book:
          title: "Chroniques de Valmont I"
          author: "Isabeau"
          pages:
            - "§lChroniques de Valmont§r\n\nRecueillies par Isabeau, archiviste de la Grande Bibliothèque.\n\n§oTome I : la Nuit Noire"
            - "Valmont fut la perle des Marches. Ses guildes forgeaient, tissaient et taillaient la pierre ; sa cathédrale portait une rosace que l'on disait plus claire que l'aube."
            - "En l'an trois cent douze, les mages de la Tour cherchèrent une Porte décrite dans des grimoires interdits : un passage vers le Néant, que seuls des yeux de feu et d'ombre pouvaient ouvrir."
            - "La nuit où ils l'ouvrirent, le ciel se déchira. Un dragon noir surgit du Néant. Les portes de Thorvald tinrent une heure. Puis Valmont brûla."
            - "Les survivants se dispersèrent dans les terres sauvages. L'intendant Alderic sauva la Charte de la ville et jura qu'un jour, Valmont renaîtrait."
      - {material: WRITABLE_BOOK, price: 7, quantity: 1, requires: {BOOK: 1, "martin:INK_SAC": 1, "roland:FEATHER": 1}}
      - {material: LECTERN, price: 16, quantity: 1, requires: {BOOK: 3, "bastien:#LOGS": 2}}
      - {material: BOOKSHELF, price: 16, quantity: 1, requires: {BOOK: 3, "bastien:#LOGS": 2}}
      - {material: CARTOGRAPHY_TABLE, price: 3, quantity: 1, requires: {PAPER: 2, "bastien:#LOGS": 1}}
    2:
      - {material: COMPASS, price: 15, quantity: 1, requires: {"thorvald:IRON_INGOT": 4, "godefroy:REDSTONE": 1}}
      - {material: MAP, price: 21, quantity: 1, requires: {PAPER: 8, "thorvald:IRON_INGOT": 4, "godefroy:REDSTONE": 1}}
      - {material: CHISELED_BOOKSHELF, price: 2, quantity: 1, requires: {"bastien:#LOGS": 2}}
    3:
      - material: WRITTEN_BOOK
        price: 8
        quantity: 1
        supply: {max: 10, restock-minutes: 10}
        name: "§3Chroniques de Valmont §7(tome II)"
        book:
          title: "Chroniques de Valmont II"
          author: "Isabeau"
          pages:
            - "§lChroniques de Valmont§r\n\n§oTome II : les dispersés"
            - "Les registres nomment ceux qui survécurent : un charbonnier des bois, une fermière des plaines, le maître maçon, le passeur de la rivière, le maître de la Fosse aux Corbeaux..."
            - "...la tavernière du Chaudron Doré, le forgeron du nord, une apprentie teinturière, le maître des écuries, un sergent de la garde, un moine de Saint-Clair, le fils du verrier et la fille du maître de la Monnaie."
            - "Chacun emporta un savoir que Valmont croyait perdu. Les réunir, c'est rebâtir la ville pierre après pierre, métier après métier."
            - "On murmure aussi que la renommée de Valmont renaissante attire des voyageurs de légende : archers, pirates, archéologues, inventeurs, magiciens... et même un dompteur de dragons."
      - {material: GLOBE_BANNER_PATTERN, price: 12, quantity: 1, supply: {max: 2, restock-minutes: 240}}
      - {material: CLOCK, price: 24, quantity: 1, requires: {"beatrice:GOLD_INGOT": 4, "godefroy:REDSTONE": 1}}
    4:
      - material: ENCHANTED_BOOK
        price: 45
        quantity: 1
        supply: {max: 1, restock-minutes: 180}
        enchantments: {efficiency: 3}
        lore:
          - "§7Copié des archives de Valmont."
      - material: ENCHANTED_BOOK
        price: 45
        quantity: 1
        supply: {max: 1, restock-minutes: 180}
        enchantments: {protection: 3}
        lore:
          - "§7Copié des archives de Valmont."
    5:
      - material: WRITTEN_BOOK
        price: 10
        quantity: 1
        supply: {max: 10, restock-minutes: 10}
        name: "§3Chroniques de Valmont §7(tome III)"
        book:
          title: "Chroniques de Valmont III"
          author: "Isabeau"
          pages:
            - "§lChroniques de Valmont§r\n\n§oTome III : la Porte du Néant"
            - "J'ai enfin déchiffré les notes des mages. La Porte n'est pas un mythe : elle dort dans une forteresse enfouie sous les terres des Marches."
            - "Pour l'ouvrir, il faut douze yeux : des perles du Néant ravivées par la poudre des gardiens de feu, ces créatures qui hantent les forteresses du Nether."
            - "Le dragon vit toujours, de l'autre côté. Tant qu'il vivra, aucune ville ne sera à l'abri. Valmont ne sera vengée que lorsqu'il tombera."
            - "Que celui qui lira ces lignes rassemble les clés, franchisse la Porte et rende aux Marches leur paix.\n\n— I."
      - material: ENCHANTED_BOOK
        price: 250
        quantity: 1
        supply: {max: 1, restock-minutes: 1440}
        enchantments: {mending: 1}
        lore:
          - "§7Le plus précieux des registres"
          - "§7sauvés de la Grande Bibliothèque."
  quests:
    quantity-multiplier: {1: 1, 2: 1.5, 3: 2, 4: 2.5, 5: 3}
    main:
      xp-reward-per-level: 25
      objectives-count: 2
      item-pool:
        - {material: PAPER, base-amount: 32}
        - {material: BOOK, base-amount: 6}
        - {material: FEATHER, base-amount: 16}
        - {material: INK_SAC, base-amount: 8}
        - {material: MAP, base-amount: 2, min-level: 2}
    special:
