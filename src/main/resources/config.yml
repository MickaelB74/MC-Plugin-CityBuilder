#  Les mines : charbon, minerais bruts, redstone, lapis et diamants.
#  Il équipe les mineurs : torches, lanternes, rails, wagonnets.
# ============================================================
godefroy:
  xp-per-stack: 1
  xp-per-coin: 1
  level-thresholds: {2: 500, 3: 2000, 4: 5500, 5: 12000}
  # Rachat (joueur → PNJ) : prix d'un lot à pleine demande, taille du lot, capacité de l'entrepôt
  sell-prices:
    COAL: {price: 6, quantity: 16, capacity: 1024}
    RAW_IRON: {price: 20, quantity: 16, capacity: 768}
    RAW_COPPER: {price: 8, quantity: 32, capacity: 1536}
    RAW_GOLD: {price: 16, quantity: 8, capacity: 256}
    REDSTONE: {price: 8, quantity: 32, capacity: 1536}
    LAPIS_LAZULI: {price: 8, quantity: 16, capacity: 768}
    DIAMOND: {price: 48, quantity: 4, capacity: 64}
  # Boutique : 'requires' = ingrédients pris dans un stock (cle_pnj:MATERIAU pour un autre artisan),
  #            'supply' = approvisionnement propre (max, +1 toutes les restock-minutes)
  shop:
    1:
      - {material: TORCH, price: 7, quantity: 32, requires: {COAL: 8}}
      - {material: LANTERN, price: 8, quantity: 2, requires: {COAL: 2, RAW_IRON: 2}}
    2:
      - {material: RAIL, price: 18, quantity: 16, requires: {RAW_IRON: 6}}
      - {material: MINECART, price: 15, quantity: 1, requires: {RAW_IRON: 5}}
      - {material: COAL_BLOCK, price: 32, quantity: 4, requires: {COAL: 36}}
    3:
      - {material: POWERED_RAIL, price: 29, quantity: 6, requires: {RAW_GOLD: 6, REDSTONE: 1}}
      - {material: DETECTOR_RAIL, price: 18, quantity: 6, requires: {RAW_IRON: 6, REDSTONE: 1}}
      - {material: LAPIS_BLOCK, price: 11, quantity: 1, requires: {LAPIS_LAZULI: 9}}
      - {material: REDSTONE_BLOCK, price: 6, quantity: 1, requires: {REDSTONE: 9}}
    4:
      - {material: IRON_PICKAXE, price: 45, quantity: 1, requires: {RAW_IRON: 3}, enchantments: {efficiency: 3, unbreaking: 2}, name: "§8Pic de la Fosse"}
    5:
      - {material: DIAMOND_PICKAXE, price: 300, quantity: 1, requires: {DIAMOND: 3}, supply: {max: 1, restock-minutes: 720}, enchantments: {efficiency: 4, fortune: 3, unbreaking: 3}, name: "§8Pioche de la Fosse aux Corbeaux"}
  quests:
    quantity-multiplier: {1: 1, 2: 1.5, 3: 2, 4: 2.5, 5: 3}
    main:
      xp-reward-per-level: 25
      objectives-count: 2
      item-pool:
        - {material: COAL, base-amount: 64}
        - {material: RAW_IRON, base-amount: 32}
        - {material: RAW_COPPER, base-amount: 64}
        - {material: REDSTONE, base-amount: 64, min-level: 2}
        - {material: LAPIS_LAZULI, base-amount: 32, min-level: 2}
    special:
      xp-reward-per-level: 60
      objectives-count: 2
      item-pool:
        - {material: RAW_GOLD, base-amount: 16}
        - {material: DIAMOND, base-amount: 2, min-level: 3}
      entity-pool:
        - {entity: CAVE_SPIDER, base-amount: 8, value: 2}
        - {entity: CREEPER, base-amount: 5, value: 3}
        - {entity: SKELETON, base-amount: 8, value: 2}

