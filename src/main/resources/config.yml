    PUFFERFISH: {price: 8, quantity: 8, capacity: 128}
    PHANTOM_MEMBRANE: {price: 6, quantity: 4, capacity: 64}
    LEATHER: {price: 8, quantity: 8, capacity: 256}
  # Boutique : 'requires' = ingrédients pris dans un stock (cle_pnj:MATERIAU pour un autre artisan),
  #            'supply' = approvisionnement propre (max, +1 toutes les restock-minutes)
  shop:
    1:
      - {material: SADDLE, price: 24, quantity: 1, supply: {max: 2, restock-minutes: 120}}
      - material: WRITTEN_BOOK
        price: 10
        quantity: 1
        supply: {max: 5, restock-minutes: 60}
        name: "§cLe manuel du dragonnier"
        book:
          title: "Le manuel du dragonnier"
          author: "Harold de Beurk"
          pages:
            - "§lLe manuel du dragonnier§r\n\npar Harold, fils de Stoïck, de Beurk.\n\nTout ce qu'on m'a appris sur les dragons était faux. Voici ce que j'ai appris ensuite."
            - "§lLes œufs§r\n\nOn les trouve dans les coffres : temples du désert (feu) et de la jungle (forêt), igloos (glace), trésors enfouis (eau), bastions et forteresses du Nether."
            - "Mais aussi : mines abandonnées (fantôme), donjons (éther), forts de l'End (améthyste, End), cités antiques (sculk), manoirs des bois (luxuriant)."
            - "§lL'éclosion§r\n\nPosez l'œuf, clic droit, et patientez. Le lieu compte : lave, neige, eau ou jungle décident de ce qui sortira de la coquille."
            - "§lL'apprivoisement§r\n\nUn dragon n'aime ni les cris ni les armes. Il aime le poisson. Beaucoup de poisson."
            - "§lLe vol§r\n\nUne selle sur le dos, et en avant ! Un sifflet (fer, planches, teinture) le rappelle de loin. Et surtout : ne regardez pas en bas."
            - "§lAu bout du monde§r\n\nDepuis la chute du dragon du Néant, des portails mènent aux îles extérieures de l'End. Les plus vieux dragons y nicheraient."
    2:
      - {material: "dmr:dragon_whistle.black", price: 30, quantity: 1, supply: {max: 2, restock-minutes: 120}}
      - {material: "dmr:dragon_whistle.red", price: 30, quantity: 1, supply: {max: 2, restock-minutes: 120}}
      - {material: "dmr:dragon_whistle.blue", price: 30, quantity: 1, supply: {max: 2, restock-minutes: 120}}
      - {material: "dmr:dragon_whistle.green", price: 30, quantity: 1, supply: {max: 2, restock-minutes: 120}}
      - {material: NAME_TAG, price: 25, quantity: 1, supply: {max: 2, restock-minutes: 360}}
    3:
      - material: POTION
        price: 16
        quantity: 1
        requires: {"anselme:NETHER_WART": 1, PHANTOM_MEMBRANE: 1}
        potion: SLOW_FALLING
        name: "§bPotion du vol plané"
        lore:
