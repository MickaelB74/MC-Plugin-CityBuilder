#  ★ HAROLD — dresseur de dragons (bonus, chapitre X)
#  Requiert le mod Dragon Mounts Remastered (voir mod-integrations).
#  Objets du mod notés « dmr:… » : ignorés si le mod est absent.
#  Rachète poisson, cuir et membranes ; vend selles, sifflets, œufs vierges.
# ============================================================
harold:
  xp-per-stack: 1
  xp-per-coin: 1
  level-thresholds: {2: 600, 3: 2400, 4: 6000, 5: 13000}
  # Rachat (joueur → PNJ) : prix d'un lot à pleine demande, taille du lot, capacité de l'entrepôt
