# ============================================================
#  DIALOGUES DES PNJ (texte écrit lettre par lettre au-dessus de la barre d’objets)
#  La barre d’action ne tient que sur une ligne : une réplique plus longue est coupée entre
#  deux mots et affichée en morceaux successifs, le nom du personnage repris à chaque fois.
# ============================================================
dialogues:
  largeur: 58   # caractères au plus par morceau (interface à l’échelle 4 en 1080p : environ 75)
