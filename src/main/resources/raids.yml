# ============================================================
#  CATALOGUE DES RAIDS (plan « Raids », docs/PLAN_RAIDS.md §7)
#  168 cibles, 8 villes fortifiées et les structures écartées.
#  Copié dans le dossier du plugin au premier démarrage, puis complété
#  à chaque nouvelle version (les entrées ajoutées s'ajoutent aux vôtres).
#  Une cible dont le mod, la structure, une créature ou le terrain manque
#  sur le serveur est masquée.
#
#  Clés d'une cible :
#    nom         nom affiché
#    type        camp, avant-poste, village, ville, fort, chateau, abordage, repaire
#    niveau      1 (Escarmouche) à 7 (Légende)
#    terrain     où la structure naît (indicatif : la cible est repérée parmi les
#                structures générées naturellement ; nether / end : autre monde des raids)
#    structure   identifiant de la structure posée
#    taille      pièce principale (x×y×z) ; rayon : rayon d'un village (blocs)
#    occupants   entités lues dans les gabarits (indicatif)
#    souterrain  true : repaire enfoui ; flottant : true : structure dans le ciel
#    defenseurs  source : gabarit (occupants de la structure), armee (soldats des
#                factions ennemies), creatures (liste d'identifiants) ;
#                complement : true = le plugin complète jusqu'au minimum du niveau ;
#                remplacer : true = occupants d'origine remplacés ;
#                maitre / chef : créature à abattre
#    active      false : cible retirée du catalogue (gardée dans le fichier)
#  Les objectifs se déduisent du type, les mods requis des espaces de noms.
# ============================================================
